name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:minify
      - name: Commit dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/index.js
          git diff --staged --quiet || git commit -m "chore: build dist for ${{ github.ref_name }}"
          # Best-effort only: main's branch protection requires the "Score npm dependencies"
          # check, which only ever runs on pull_request -- a direct push here can never satisfy
          # it, so this push is expected to fail under normal branch protection and that's fine.
          # It's not load-bearing: the tag below is created from this same local commit
          # regardless of whether main accepted the push, and consumers pin the tag
          # (`uses: packagerating/audit-dependencies@v1`), not main directly. A successful push
          # here is a nice-to-have (keeps main's checked-in dist/index.js in sync with the last
          # release) but must never fail the release itself.
          git push origin HEAD:main || echo "::warning::Could not push the dist rebuild to main (expected under branch protection -- the release tag is unaffected and will still contain the correct build)."
      - name: Move version tag to the dist-build commit
        run: |
          git tag -f "${{ github.ref_name }}"
          git push origin "${{ github.ref_name }}" --force
      - name: Create GitHub Release
        run: gh release create "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Update major version tag
        run: |
          MAJOR=$(echo "${{ github.ref_name }}" | grep -oE '^v[0-9]+')
          git tag -f "$MAJOR"
          git push origin "$MAJOR" --force
